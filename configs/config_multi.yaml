project_name: "Nuclear_Data_Inference_2025"
output_dir: "data/mcmc_chains/"
figures_dir: "reports/figures/multi-micro_noNorm/"

# -----------------------------------------------------------------------------
# Global Defaults (Apply to all experiments unless overridden)
# -----------------------------------------------------------------------------
defaults:
  gp:
    kernel: "RBF"          # Options: RBF, Matern52, RationalQuadratic
    normalize_y: false     # Standardize output data before training
    n_restarts: 10         # Optimization restarts for GP hyperparameters
  
  mcmc:
    sampler: "emcee"
    n_walkers: 10
    n_steps: 4000
    burn_in: 200
    random_seed: 102

# -----------------------------------------------------------------------------
# Prior Information
# -----------------------------------------------------------------------------
parameters:
  names: ["Gg1", "Gg2", "Gg3", "Gg4", "normalization"]
  labels: ['$\Gamma_\gamma$ (E=4.1 keV), eV', '$\Gamma_\gamma$ (E=5.7 keV), eV', '$\Gamma_\gamma$ (E=6.8 keV), eV', '$\Gamma_\gamma$ (E=8.2 keV), eV', 'Normalization']
  prior_means: [5.038040, 0.7871651, 4.143858, 3.352590, 1.0]
  prior_stds: [0.20, 0.20, 0.20, 0.20, 0.10]

# -----------------------------------------------------------------------------
# Experiment Definitions
# -----------------------------------------------------------------------------
experiments:
  - id: "cr53_thin"
    title: "nTOF Cr53 thin (2022)"
    description: "Time-of-Flight measurement performed in nTOF (CERN) by Pablo Perez et at. using thin Cr-53 target"
    type: "microscopic" # microscopic assumes your output is based on chi-squared
    gp_override:
      kernel: "RBF"
      
    training_data:
      input_path: "data/processed/with-norm/ntof-multi-norm/ntof-multi-norm_inputs.csv"
      output_path: "data/processed/with-norm/ntof-multi-norm/ntof-multi-norm_outputs.csv" # Using reduced chi-squared statistic
      C_constant: 586.9892203452627 # -0.5 * (np.log(2 * np.pi * df_lst['dx'].mean()**2))

  - id: "normalization"
    title: "nTOF Cr53 thin normalization constraint"
    description: "Constraint to also take into account uncertainty due to the normalization factor in the nTOF capture yield data"
    type: "normalization"

    experimental_data:
      measurement: 1.0
      uncertainty: 0.0000001

